# Ansible Playbook: Provision LNT Device Host
# This playbook sets up a Raspberry Pi as an LNT Device Host with
# OpenOCD-based flashing support, serial tools, logging, and device rules.

- name: Provision LNT Device Host
  hosts: lnt_device_hosts
  become: yes

  vars:
    log_directory: /var/log/lnt
    image_storage: /opt/lnt/images
    lnt_user: lnt
    lnt_group: lnt

  tasks:

    # -----------------------------------------------------------
    # System Utility Installation
    # -----------------------------------------------------------
    - name: Install general utilities
      apt:
        name:
          - curl
          - zip
          - unzip
          - git
          - python3
          - python3-pip
          - python3-serial
          - screen
          - minicom
        state: present
        update_cache: yes

    # -----------------------------------------------------------
    # OpenOCD Installation (Core Flashing Requirement)
    # -----------------------------------------------------------
    - name: Install OpenOCD and USB libraries required for flashing
      apt:
        name:
          - openocd
          - usbutils            # lsusb
          - libusb-1.0-0        # required for JTAG/SWD interface communication
        state: present

    - name: Verify OpenOCD installation
      command: openocd --version
      register: openocd_version
      changed_when: false

    - name: Display OpenOCD version
      debug:
        msg: "OpenOCD installed: {{ openocd_version.stdout }}"

    # -----------------------------------------------------------
    # Directory Setup
    # -----------------------------------------------------------
    - name: Create LNT directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ lnt_user }}"
        group: "{{ lnt_group }}"
        mode: '0755'
      loop:
        - "{{ log_directory }}"
        - "{{ image_storage }}"
        - /opt/lnt/scripts
        - /opt/lnt/config

    # -----------------------------------------------------------
    # Udev Rules for TI LaunchPads (XDS110 Debug Probe)
    # -----------------------------------------------------------
    - name: Install TI XDS110 udev rules
      copy:
        content: |
          # TI XDS110 Debug Probe (CC13xx/CC26xx LaunchPads)
          ATTRS{idVendor}=="0451", ATTRS{idProduct}=="bef3", MODE="0666", GROUP="{{ lnt_group }}"
        dest: /etc/udev/rules.d/60-xds110.rules
        owner: root
        group: root
        mode: '0644'

    - name: Reload udev rules
      command: udevadm control --reload-rules

    - name: Trigger udev to apply rules
      command: udevadm trigger

    # -----------------------------------------------------------
    # Deploy OpenOCD Interface & Board Configurations
    # -----------------------------------------------------------
    - name: Deploy OpenOCD interface configs
      copy:
        src: files/openocd/interfaces/
        dest: /etc/openocd/interfaces/
        mode: '0644'

    - name: Deploy OpenOCD board configs
      copy:
        src: files/openocd/boards/
        dest: /etc/openocd/boards/
        mode: '0644'

    # -----------------------------------------------------------
    # Serial Logging Infrastructure
    # -----------------------------------------------------------
    - name: Create serial log capture script
      template:
        src: serial_log_capture.sh.j2
        dest: /opt/lnt/scripts/serial_log_capture.sh
        owner: "{{ lnt_user }}"
        group: "{{ lnt_group }}"
        mode: '0755'

    # -----------------------------------------------------------
    # Log Rotation
    # -----------------------------------------------------------
    - name: Configure log rotation for serial logs
      copy:
        content: |
          {{ log_directory }}/*.log {
            daily
            rotate 7
            compress
            delaycompress
            missingok
            notifempty
            create 0644 {{ lnt_user }} {{ lnt_group }}
          }
        dest: /etc/logrotate.d/lnt
        owner: root
        group: root
        mode: '0644'

